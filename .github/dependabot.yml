# Version updates only (security alerts stay off: app/ is deliberately vulnerable). Root only: never app/,
# and never the scanner locks in src/okf_grc/data/locks/, which `make lock-scanners` regenerates whole.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

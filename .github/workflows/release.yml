name: release

# Pushing a version tag (v1.1.0) runs every test, checks the tag equals the package version,
# and publishes a GitHub release. Adopters install that tag: `uv tool install git+…@v1.1.0`.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release job: a poisoned cache must not reach a release.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: Tag equals the package version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: make bootstrap
      - run: make audit
      - run: make test
      - run: make test-integration
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

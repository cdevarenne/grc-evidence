[project]
name = "okf-grc"
version = "1.6.0"
description = "Scan an app, map findings to SOC 2, ISO/IEC 42001, and EU AI Act controls through an OKF bundle, and emit OSCAL."
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
llm = ["anthropic>=1.8"]
mcp = ["mcp>=2.2,<3"]  # grc mcp: the MCP server

[project.scripts]
grc = "okf_grc.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "jsonschema>=4.25",
    "zizmor==1.30.1",
    "types-pyyaml>=6.0.12.20260906",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-jsonschema>=4.26.0.20260518",
    "mcp>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires scanners installed (make test-integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py314"
extend-exclude = ["src/okf_grc/data/policies/semgrep", "policies/semgrep", "app"]  # rule test fixtures (#97) and the sample app

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ISC", "FURB", "UP"]
ignore = ["E501"]  # long lines are left as they are, not reformatted wholesale

[tool.mypy]
python_version = "3.14"
files = ["src/okf_grc", "tests"]
exclude = ["src/okf_grc/data/policies/semgrep/"]

[[tool.mypy.overrides]]
module = ["anthropic"]  # the optional `llm` extra
ignore_missing_imports = true

[project]
name = "okf-grc"
version = "1.2.1"
description = "Scan an app, map findings to SOC 2, ISO/IEC 42001, and EU AI Act controls through an OKF bundle, and emit OSCAL."
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
llm = ["anthropic>=1.8"]

[project.scripts]
grc = "okf_grc.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "jsonschema>=4.25",
    "zizmor==1.30.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires scanners installed (make test-integration)"]
addopts = "-m 'not integration'"

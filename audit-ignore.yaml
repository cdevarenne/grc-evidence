# Reviewed exceptions for `make audit` (supply-chain scan of the engine's own dependencies).
# Like a suppression: one exact finding, a reason, an expiry at most 90 days out. Never applied to the
# scans grc runs on an app; Trivy reads this file only when `make audit` passes it.
vulnerabilities:
  # pyjwt 2.13.0 in Semgrep 1.178.0's dependencies: Semgrep pins pyjwt<2.14, and imports it only in its
  # own MCP server's token verifier (mcp/utilities/token_verifier.py), which `semgrep scan` never starts.
  # Re-review when Semgrep releases a version that allows pyjwt>=2.14.0.
  - id: CVE-2026-102268
    paths: [src/okf_grc/data/locks/semgrep/requirements.txt]
    statement: Unreachable in okf-grc's use (semgrep scan, local rules); Semgrep 1.178.0 pins pyjwt<2.14.
    expired_at: 2026-12-30
